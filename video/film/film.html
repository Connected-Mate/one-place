<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One Place film</title>
<style>
@font-face{font-family:'Google Sans';src:url('/fonts/gs-latin.woff2') format('woff2');font-weight:400 700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#fff;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#fff;font-family:'Google Sans',sans-serif;color:#1f1f1f;font-weight:500;letter-spacing:-.018em;-webkit-font-smoothing:antialiased;font-kerning:normal;font-feature-settings:"kern","liga"}
.layer{position:absolute;inset:0;will-change:transform}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tline{display:flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1.14;position:relative}
.tok{display:inline-block;white-space:pre}
.ch{display:inline-block;white-space:pre}
.tile{display:inline-flex;align-items:center;justify-content:center;width:1.06em;height:1.06em;border-radius:.2em;background:#f3f4f6;margin:0 .13em}
.tile img{width:.62em;height:.62em;display:block}
.blue{color:#4285f4}
.caret{position:absolute;width:.052em;height:.84em;top:50%;margin-top:-.42em;border-radius:.02em}
.wrap3d{position:absolute;inset:0;perspective:2600px;transform-style:preserve-3d}
.fshadow{position:absolute;transform-style:preserve-3d;border-radius:var(--r,36px);box-shadow:0 44px 120px rgba(66,133,244,.20),0 10px 40px rgba(66,133,244,.10)}
.fcard{position:absolute;inset:0;border-radius:var(--r,36px);overflow:hidden;background:#fff}
.fcard img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;will-change:transform}
.chip{position:absolute;display:flex;align-items:center;background:#fff;border-radius:.42em;box-shadow:0 .24em .9em rgba(66,133,244,.18),0 .03em .2em rgba(60,64,67,.10);padding:.42em .62em;letter-spacing:-.005em;font-weight:500;white-space:nowrap;color:#1f1f1f}
.chip img{width:1.25em;height:1.25em;margin-right:.45em;display:block}
.tabbar{position:absolute;left:0;right:0;top:0;background:#e9eef6;display:flex;align-items:flex-end;overflow:hidden}
.btab{flex:1 1 0;min-width:0;display:flex;align-items:center;background:#fff;border-radius:.6em .6em 0 0;overflow:hidden;white-space:nowrap;letter-spacing:0;font-weight:400;color:#444746;border-right:1px solid #d3e3fd}
.btab img{flex:none;display:block}
.badge{position:absolute;background:#d93025;color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:0}
.appt{position:absolute;display:flex;flex-direction:column;align-items:center;font-weight:400;color:#444746;letter-spacing:0;white-space:nowrap}
.appt .box{display:flex;align-items:center;justify-content:center}
.appt img{display:block}
.face{position:absolute;border-radius:50%;background-size:cover;background-position:center 25%;box-shadow:0 30px 80px rgba(66,133,244,.18)}
.glow{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 var(--g1) var(--g2) rgba(66,133,244,.62),inset 0 0 var(--g3) var(--g4) rgba(142,197,252,.55)}
.subs{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.subs span{display:inline-block;background:rgba(32,33,36,.86);color:#fff;font-weight:400;letter-spacing:0;line-height:1.28;text-align:center;border-radius:.62em;padding:.34em .74em;max-width:88%}
.end-name{font-weight:500}
.mini{font-weight:400;letter-spacing:0}
</style></head>
<body><div id="stage"></div><script src="/film/film.js"></script></body></html>
